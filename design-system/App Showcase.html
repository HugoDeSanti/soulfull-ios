<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soulfull Gatherings — App Showcase</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(140% 80% at 50% -10%, #16170f 0%, #0a0b06 55%, #050505 100%) fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 72px 40px 120px; }

  header.top { text-align: center; margin-bottom: 16px; }
  header.top img { width: 92px; display: block; margin: 0 auto 22px; opacity: .95; }
  header.top .eb {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--honey); margin: 0;
  }
  header.top h1 {
    font-size: 54px; font-weight: var(--w-light); letter-spacing: -1px;
    margin: 14px 0 0; color: var(--ink);
  }
  header.top p {
    font-size: 15px; color: var(--ink-soft); margin: 14px auto 0; max-width: 480px;
    line-height: 1.6;
  }
  header.top .count {
    display: inline-flex; gap: 22px; margin-top: 26px;
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
  }
  header.top .count b { color: var(--ink); font-weight: var(--w-medium); }

  /* Section */
  .flow { margin-top: 78px; }
  .flow-head { display: flex; align-items: baseline; gap: 16px; margin: 0 4px 30px; }
  .flow-head .idx {
    font-size: 13px; font-weight: var(--w-medium); letter-spacing: 1px;
    color: var(--honey); font-variant-numeric: tabular-nums;
  }
  .flow-head h2 {
    font-size: 26px; font-weight: var(--w-regular); letter-spacing: -0.4px; margin: 0;
  }
  .flow-head .desc { font-size: 13px; color: var(--muted); margin-left: auto; }
  .flow-head .line { display: none; }

  /* Phone grid */
  --pw: 446; --ph: 900;
  .grid {
    display: flex; flex-wrap: wrap; gap: 38px 30px;
  }

  .phone { width: 250px; }
  .phone .frame {
    width: 250px; height: 504px; overflow: hidden; position: relative;
    border-radius: 10px;
  }
  .phone .frame iframe {
    width: 446px; height: 900px; border: 0;
    transform: scale(0.5605); transform-origin: top left;
    pointer-events: none;
  }
  /* Click overlay opens the real screen */
  .phone a.hit {
    position: absolute; inset: 0; z-index: 3; display: block;
  }
  .phone .cap {
    display: flex; align-items: baseline; gap: 8px; margin: 16px 6px 0;
  }
  .phone .cap .n {
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    letter-spacing: .5px;
  }
  .phone .cap .t {
    font-size: 14px; color: var(--ink-soft); font-weight: var(--w-medium);
    letter-spacing: -0.1px;
  }
  .phone:hover .cap .t { color: var(--ink); }

  footer.bot {
    margin-top: 100px; text-align: center; font-size: 12px; color: var(--muted);
    letter-spacing: 1px; border-top: 1px solid var(--line); padding-top: 30px;
  }

  @media (max-width: 720px) {
    .wrap { padding: 48px 20px 80px; }
    header.top h1 { font-size: 40px; }
    .grid { gap: 30px 22px; justify-content: center; }
  }
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <img src="assets/logo.png" alt="Soulfull Gatherings">
    <p class="eb">Soulfull Gatherings</p>
    <h1>The app, end to end</h1>
    <p>Every screen of the iOS experience — from first launch through onboarding, daily practice, and the retreats that bring the circle together.</p>
    <span class="count"><span><b id="ct-screens">26</b> screens</span><span><b id="ct-flows">5</b> flows</span><span><b>iPhone</b> 390×844</span></span>
  </header>

  <div id="flows"></div>

  <footer class="bot">Soulfull Gatherings · design system mirror · tap any screen to open it full size</footer>
</div>

<script>
const FLOWS = [
  { title: "Welcome & Onboarding", desc: "First launch → a calibrated start",
    screens: [
      ["welcome-splash", "Splash"],
      ["welcome-slide", "Welcome"],
      ["onboarding-name", "Your name"],
      ["onboarding-state", "Body state"],
      ["onboarding-intention", "Intention"],
      ["onboarding-frequency", "Rhythm"],
      ["onboarding-finish", "All set"],
    ]},
  { title: "Home", desc: "The daily landing",
    screens: [
      ["home", "Dashboard"],
    ]},
  { title: "Practice", desc: "Guided rituals, journaling, nourishment",
    screens: [
      ["practice-landing", "Practice"],
      ["practice-list", "Browse"],
      ["player", "Player"],
      ["exercise-detail", "Exercise"],
      ["journal-detail", "Journal"],
      ["massage-detail", "Massage"],
      ["recipe-detail", "Recipe"],
    ]},
  { title: "Retreats", desc: "Discover, book, and prepare to gather",
    screens: [
      ["retreats-catalog", "Catalog"],
      ["retreats-stack", "Saved"],
      ["retreat-detail", "Retreat"],
      ["retreat-checkout", "Checkout"],
      ["retreat-todos", "Prepare"],
      ["mallorca-welcome", "Mallorca"],
      ["mallorca-guides", "Guides"],
      ["mallorca-chatbot", "Concierge"],
    ]},
  { title: "Community & You", desc: "The circle, your people, your account",
    screens: [
      ["community", "Community"],
      ["profile", "Profile"],
      ["account", "Account"],
    ]},
];

let n = 0;
const total = FLOWS.reduce((a, f) => a + f.screens.length, 0);
const root = document.getElementById("flows");

FLOWS.forEach((flow, fi) => {
  const sec = document.createElement("section");
  sec.className = "flow";
  const idx = String(fi + 1).padStart(2, "0");
  sec.innerHTML = `
    <div class="flow-head">
      <span class="idx">${idx}</span>
      <h2>${flow.title}</h2>
      <span class="desc">${flow.desc}</span>
    </div>
    <div class="grid"></div>`;
  const grid = sec.querySelector(".grid");
  flow.screens.forEach(([file, label]) => {
    n++;
    const num = String(n).padStart(2, "0");
    const card = document.createElement("div");
    card.className = "phone";
    const src = "screens/" + file + ".html";
    card.innerHTML = `
      <div class="frame">
        <a class="hit" href="${src}" target="_blank" rel="noopener" aria-label="${label}"></a>
        <iframe loading="lazy" scrolling="no" src="${src}" title="${label}"></iframe>
      </div>
      <div class="cap"><span class="n">${num}</span><span class="t">${label}</span></div>`;
    grid.appendChild(card);
  });
  root.appendChild(sec);
});

document.getElementById("ct-screens").textContent = total;
document.getElementById("ct-flows").textContent = FLOWS.length;
</script>
</body></html>
