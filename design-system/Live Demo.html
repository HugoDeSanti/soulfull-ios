<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soulfull Gatherings — Live Demo</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(130% 90% at 50% -10%, #16170f 0%, #080905 58%, #050505 100%) fixed;
    height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 1fr;
  }

  /* ---- Stage ---- */
  .stage {
    position: relative; height: 100vh; width: 100%;
    display: grid; place-items: center;
  }

  /* Scaled phone holder. Native iframe size 446x900; scaled via --s */
  .device-scale {
    position: relative;
    width: calc(446px * var(--s));
    height: calc(900px * var(--s));
  }
  .device-scale .layers {
    position: absolute; top: 0; left: 0;
    width: 446px; height: 900px;
    transform: scale(var(--s)); transform-origin: top left;
  }
  iframe.screen {
    position: absolute; inset: 0;
    width: 446px; height: 900px; border: 0; background: transparent;
    transition: opacity .42s ease;
  }
  iframe.screen.back { opacity: 0; pointer-events: none; }

  /* Tap layer over the device only */
  .tap {
    position: absolute; inset: 0; z-index: 10;
    cursor: pointer;
  }
  /* Back zone — left edge swipe-back affordance */
  .backzone {
    position: absolute; top: 12%; left: 0; bottom: 12%;
    width: 13%; z-index: 11; cursor: pointer;
  }

  /* ---- Chrome ---- */
  .hud-top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 16px;
    padding: 22px 28px;
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 11px; pointer-events: auto; }
  .brand img { width: 26px; height: 26px; opacity: .92; }
  .brand .nm { font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-soft); }
  .brand .nm b { color: var(--honey); font-weight: var(--w-medium); }

  .step {
    margin-left: auto; pointer-events: auto;
    font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted);
    font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 10px;
  }
  .step .now { color: var(--ink); }

  /* ---- Bottom controls ---- */
  .hud-bot {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 20px 28px 26px;
    pointer-events: none;
  }
  .ctl {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 9px;
    height: 44px; padding: 0 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    color: var(--ink-soft); font-size: 13px; letter-spacing: .3px;
    font-family: var(--font); cursor: pointer;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: background .2s, color .2s, border-color .2s, opacity .2s;
    white-space: nowrap;
  }
  .ctl:hover { background: rgba(255,255,255,0.10); color: var(--ink); border-color: var(--glass-border-high); }
  .ctl:disabled { opacity: .32; cursor: default; }
  .ctl svg { display: block; }
  .ctl.primary { background: var(--honey); color: #20210f; border-color: transparent; font-weight: var(--w-medium); }
  .ctl.primary:hover { background: #efd47e; color: #20210f; }
  .ctl .lbl { font-variant-numeric: tabular-nums; }

  .scrub { display: flex; align-items: center; gap: 4px; pointer-events: auto; padding: 0 6px; }
  .dot {
    width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.18);
    cursor: pointer; transition: background .2s, transform .2s; flex: 0 0 auto;
  }
  .dot:hover { background: rgba(255,255,255,0.4); transform: scale(1.3); }
  .dot.on { background: var(--honey); }
  .dot.sec { background: rgba(229,199,102,0.35); }

  /* Section label pill */
  .sect {
    position: fixed; left: 50%; top: 64px; transform: translateX(-50%);
    z-index: 35; pointer-events: none;
    font-size: 11px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--honey);
    opacity: 0; transition: opacity .4s;
  }
  .sect.show { opacity: .9; }

  /* ---- Map overlay ---- */
  .map {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(5,6,3,0.86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    opacity: 0; visibility: hidden; transition: opacity .3s;
    overflow-y: auto;
  }
  .map.show { opacity: 1; visibility: visible; }
  .map-in { max-width: 1080px; margin: 0 auto; padding: 64px 40px 90px; }
  .map h2 { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--honey); margin: 0 0 4px; font-weight: var(--w-medium); }
  .map .sub { font-size: 26px; font-weight: var(--w-light); letter-spacing: -.5px; margin: 0 0 38px; color: var(--ink); }
  .map-close {
    position: fixed; top: 26px; right: 30px; z-index: 81;
    width: 42px; height: 42px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border);
    color: var(--ink); display: grid; place-items: center;
  }
  .map-close:hover { background: rgba(255,255,255,0.12); }
  .mflow { margin-bottom: 36px; }
  .mflow .fh { display: flex; align-items: baseline; gap: 12px; margin: 0 2px 16px; }
  .mflow .fh .i { font-size: 12px; color: var(--honey); font-variant-numeric: tabular-nums; }
  .mflow .fh .t { font-size: 15px; color: var(--ink-soft); letter-spacing: .3px; }
  .mgrid { display: flex; flex-wrap: wrap; gap: 22px 18px; }
  .mcard { width: 132px; cursor: pointer; }
  .mcard .fr { width: 132px; height: 266px; border-radius: 16px; overflow: hidden; position: relative;
    border: 1px solid var(--line); transition: border-color .2s, transform .2s; background: #07080500; }
  .mcard:hover .fr { border-color: var(--honey); transform: translateY(-3px); }
  .mcard.cur .fr { border-color: var(--honey); box-shadow: 0 0 0 1px var(--honey); }
  .mcard .fr iframe { width: 446px; height: 900px; border: 0; transform: scale(.2959); transform-origin: top left; pointer-events: none; }
  .mcard .cap { display: flex; gap: 7px; align-items: baseline; margin: 9px 3px 0; }
  .mcard .cap .n { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mcard .cap .t { font-size: 12px; color: var(--ink-soft); }
  .mcard:hover .cap .t { color: var(--ink); }

  @media (max-height: 720px) {
    .hud-top { padding: 14px 20px; }
  }
</style>
</head><body>

<div class="stage">
  <div class="sect" id="sect"></div>
  <div class="device-scale" id="dscale">
    <div class="layers">
      <iframe class="screen" id="fr-a" scrolling="no" title="Soulfull"></iframe>
      <iframe class="screen back" id="fr-b" scrolling="no" title="Soulfull"></iframe>
    </div>
    <div class="backzone" id="backzone" title="Back"></div>
    <div class="tap" id="tap" title="Tap to continue"></div>
  </div>
</div>

<div class="hud-top">
  <div class="brand">
    <img src="assets/logo.png" alt="">
    <span class="nm"><b>Soulfull</b> · live demo</span>
  </div>
  <div class="step"><span class="now" id="stepNow">01</span> / <span id="stepTot">26</span></div>
</div>

<div class="hud-bot">
  <button class="ctl" id="btnBack" title="Back">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3 4.5 7l4 4"/></svg>
    Back
  </button>
  <div class="scrub" id="scrub"></div>
  <button class="ctl" id="btnMap" title="All screens">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/></svg>
    Map
  </button>
  <button class="ctl primary" id="btnNext" title="Continue">
    Next
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3 9.5 7l-4 4"/></svg>
  </button>
</div>

<!-- Map overlay -->
<div class="map" id="map">
  <div class="map-close" id="mapClose" title="Close">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l10 10M13 3 3 13"/></svg>
  </div>
  <div class="map-in">
    <h2>Soulfull Gatherings</h2>
    <p class="sub">Jump to any screen</p>
    <div id="mapFlows"></div>
  </div>
</div>

<script>
const FLOWS = [
  { title: "Welcome & Onboarding", screens: [
    ["welcome-splash","Splash"],["welcome-slide","Welcome"],["onboarding-name","Your name"],
    ["onboarding-state","Body state"],["onboarding-intention","Intention"],
    ["onboarding-frequency","Rhythm"],["onboarding-finish","All set"] ]},
  { title: "Home", screens: [ ["home","Dashboard"] ]},
  { title: "Practice", screens: [
    ["practice-landing","Practice"],["practice-list","Browse"],["player","Player"],
    ["exercise-detail","Exercise"],["journal-detail","Journal"],["massage-detail","Massage"],
    ["recipe-detail","Recipe"] ]},
  { title: "Retreats", screens: [
    ["retreats-catalog","Catalog"],["retreats-stack","Saved"],["retreat-detail","Retreat"],
    ["retreat-checkout","Checkout"],["retreat-todos","Prepare"],["mallorca-welcome","Mallorca"],
    ["mallorca-guides","Guides"],["mallorca-chatbot","Concierge"] ]},
  { title: "Community & You", screens: [
    ["community","Community"],["profile","Profile"],["account","Account"] ]},
];

// Flatten
const SEQ = [];
FLOWS.forEach((f, fi) => f.screens.forEach(([file, label], si) => {
  SEQ.push({ file, label, flow: f.title, flowIdx: fi, first: si === 0 });
}));
const TOTAL = SEQ.length;

const LS = "soulfull-demo-idx";
let idx = clamp(parseInt(localStorage.getItem(LS) || "0", 10) || 0);
let frontIsA = true;

const frA = document.getElementById("fr-a");
const frB = document.getElementById("fr-b");
const tap = document.getElementById("tap");
const backzone = document.getElementById("backzone");
const stepNow = document.getElementById("stepNow");
const stepTot = document.getElementById("stepTot");
const btnNext = document.getElementById("btnNext");
const btnBack = document.getElementById("btnBack");
const btnMap = document.getElementById("btnMap");
const scrub = document.getElementById("scrub");
const sect = document.getElementById("sect");
const dscale = document.getElementById("dscale");

stepTot.textContent = String(TOTAL).padStart(2, "0");

function clamp(i){ return Math.max(0, Math.min(TOTAL - 1, i)); }
function src(i){ return "screens/" + SEQ[i].file + ".html"; }

function fitScale(){
  // Fit 446x900 device into available viewport (minus chrome margins)
  const availH = window.innerHeight - 150;   // top + bottom HUD
  const availW = window.innerWidth - 80;
  const s = Math.min(availH / 900, availW / 446, 1.05);
  dscale.style.setProperty("--s", s.toFixed(4));
}

// Build scrubber dots
SEQ.forEach((s, i) => {
  const d = document.createElement("div");
  d.className = "dot" + (s.first ? " sec" : "");
  d.title = s.label;
  d.addEventListener("click", () => go(i, i > idx ? 1 : -1));
  scrub.appendChild(d);
});
const dots = [...scrub.children];

let busy = false;
function render(dir){
  const front = frontIsA ? frA : frB;
  const back  = frontIsA ? frB : frA;
  // Load new screen into the hidden iframe, then crossfade
  back.src = src(idx);
  busy = true;
  back.onload = () => {
    back.classList.remove("back");
    front.classList.add("back");
    frontIsA = !frontIsA;
    setTimeout(() => { busy = false; }, 200);
  };
  // safety unlock
  setTimeout(() => { busy = false; }, 900);

  stepNow.textContent = String(idx + 1).padStart(2, "0");
  btnBack.disabled = idx === 0;
  btnNext.disabled = idx === TOTAL - 1;
  btnNext.querySelector(".lbl") && (btnNext.querySelector(".lbl").textContent = idx === TOTAL - 1 ? "Done" : "Next");
  dots.forEach((d, i) => d.classList.toggle("on", i === idx));
  // section label flash
  sect.textContent = SEQ[idx].flow;
  sect.classList.add("show");
  clearTimeout(sect._t);
  sect._t = setTimeout(() => sect.classList.remove("show"), 1400);
  localStorage.setItem(LS, String(idx));
}

function go(to, dir){
  to = clamp(to);
  if (to === idx) return;
  idx = to;
  render(dir);
}
function next(){ if (idx < TOTAL - 1) go(idx + 1, 1); }
function prev(){ if (idx > 0) go(idx - 1, -1); }

// Initial load (no crossfade)
frA.src = src(idx);
stepNow.textContent = String(idx + 1).padStart(2, "0");
btnBack.disabled = idx === 0;
dots.forEach((d, i) => d.classList.toggle("on", i === idx));
sect.textContent = SEQ[idx].flow; sect.classList.add("show");
setTimeout(() => sect.classList.remove("show"), 1600);

// Interactions
tap.addEventListener("click", next);
backzone.addEventListener("click", prev);
btnNext.addEventListener("click", next);
btnBack.addEventListener("click", prev);

document.addEventListener("keydown", (e) => {
  if (document.getElementById("map").classList.contains("show")) {
    if (e.key === "Escape") closeMap();
    return;
  }
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (e.key.toLowerCase() === "m") openMap();
});

window.addEventListener("resize", fitScale);
fitScale();

// ---- Map ----
const map = document.getElementById("map");
const mapFlows = document.getElementById("mapFlows");
let mapBuilt = false;
function buildMap(){
  if (mapBuilt) return; mapBuilt = true;
  let n = 0;
  FLOWS.forEach((flow, fi) => {
    const sec = document.createElement("div");
    sec.className = "mflow";
    sec.innerHTML = `<div class="fh"><span class="i">${String(fi+1).padStart(2,"0")}</span><span class="t">${flow.title}</span></div><div class="mgrid"></div>`;
    const grid = sec.querySelector(".mgrid");
    flow.screens.forEach(([file, label]) => {
      const here = n;
      const card = document.createElement("div");
      card.className = "mcard";
      card.dataset.i = here;
      card.innerHTML = `<div class="fr"><iframe loading="lazy" scrolling="no" src="screens/${file}.html"></iframe></div><div class="cap"><span class="n">${String(here+1).padStart(2,"0")}</span><span class="t">${label}</span></div>`;
      card.addEventListener("click", () => { closeMap(); go(here, here > idx ? 1 : -1); });
      grid.appendChild(card);
      n++;
    });
    mapFlows.appendChild(sec);
  });
}
function openMap(){ buildMap(); markMap(); map.classList.add("show"); }
function closeMap(){ map.classList.remove("show"); }
function markMap(){ [...mapFlows.querySelectorAll(".mcard")].forEach(c => c.classList.toggle("cur", +c.dataset.i === idx)); }
btnMap.addEventListener("click", openMap);
document.getElementById("mapClose").addEventListener("click", closeMap);
map.addEventListener("click", (e) => { if (e.target === map) closeMap(); });
</script>
</body></html>
