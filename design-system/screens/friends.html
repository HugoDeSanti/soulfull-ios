<!-- @dsCard group="Screens · Tabs" name="Community — friends" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community — friends</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  /* Features/Community/FriendsView.swift. Pushed from the Community tab
     behind the account gate. Search by NAME (matches the full name
     server-side, shows the abbreviated one; never by email), then the
     requests waiting on you, the ones you sent, and your friends — open rows
     on the dusk atmosphere. Every row (search results too) ends in "⋯" after
     its buttons (.member-menu in
     app.css): Report → report-member, Block → the confirmation described on
     the community card. */
  .scr { padding: 62px var(--gutter) 130px; }
  .scr > * + * { margin-top: 36px; }
  .back { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink); }
  .eb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
  h1 { font-size: 34px; font-weight: var(--w-light); letter-spacing: -0.8px; color: var(--ink); margin: 6px 0 0; }
  .sub { font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 6px 0 0; }
  /* A square veiled field, 50pt; its hairline lifts while focused. UIKit-backed
     in Swift — no text halo on it. The clear button is a bare ×. */
  .search { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; font-size: 15px; color: var(--muted); }
  .search svg { color: var(--ink-soft); flex: none; }
  .sec .section-label { --sl-pad: 0; margin-bottom: 4px; }
  .rows { display: flex; flex-direction: column; }
  /* MemberRow — face, name, its controls; open rows, a hairline above every
     row but a section's first. */
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .row + .row { border-top: 0.5px solid var(--line); }
  .row .name { flex: 1; min-width: 0; font-size: 15px; font-weight: var(--w-medium); color: var(--ink); }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: var(--w-medium); color: var(--ink); border: var(--hairline) solid var(--glass-border); }
  .av.t0 { background-image: linear-gradient(135deg, #454d1c, #262b0d); }
  .av.t2 { background-image: linear-gradient(135deg, #6b3d38, #40211f); }
  .av.t3 { background-image: linear-gradient(135deg, #334054, #1a2130); }
  .av.t4 { background-image: linear-gradient(135deg, #544533, #30261a); }
  /* Square buttons, 34 tall in a 44pt target: an ink block for the primary
     verb (Add / Accept), an ink hairline for the rest (Decline / Withdraw /
     Remove). A standing (Requested / Friends) is small caps text with no box.
     Remove asks for confirmation. */
  .pill { height: 34px; padding: 0 14px; border: var(--hairline) solid rgba(242,241,237,.7); font-family: var(--font); font-size: 13px; font-weight: var(--w-medium); color: var(--ink); background: none; cursor: pointer; display: inline-flex; align-items: center; }
  .pill.fill { background: var(--ink); border-color: var(--ink); color: #000; position: static; }  /* not app.css's .fill overlay helper */
  .chip-state { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-soft); }
  .ctl { display: flex; gap: 8px; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen screen--scroll scr">
    <div class="atmosphere atmosphere--dusk"></div>

    <a class="back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M20 12H4m0 0 6-6m-6 6 6 6"/></svg>Community</a>
    <div>
      <p class="eb">Friends</p>
      <h1>Your people</h1>
      <p class="sub">Find the people you practice with. What they finish joins your Friends feed, and what you finish joins theirs.</p>
    </div>

    <div class="search glass"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search members by name</div>

    <div class="sec">
      <div class="section-label"><span class="title">Requests</span></div>
      <div class="rows">
        <div class="row"><div class="av t4">N</div><span class="name">Nia</span><div class="ctl"><button class="pill fill">Accept</button><button class="pill">Decline</button></div><button class="member-menu" aria-label="More for Nia"><svg width="15" height="4" viewBox="0 0 15 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="7.5" cy="2" r="1.7"/><circle cx="13" cy="2" r="1.7"/></svg></button></div>
      </div>
    </div>
    <div class="sec">
      <div class="section-label"><span class="title">Sent</span></div>
      <div class="rows">
        <div class="row"><div class="av t0">M</div><span class="name">Mateo V.</span><button class="pill">Withdraw</button><button class="member-menu" aria-label="More for Mateo V."><svg width="15" height="4" viewBox="0 0 15 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="7.5" cy="2" r="1.7"/><circle cx="13" cy="2" r="1.7"/></svg></button></div>
      </div>
    </div>
    <div class="sec">
      <div class="section-label"><span class="title">Friends</span></div>
      <div class="rows">
        <div class="row"><div class="av t2">A</div><span class="name">Alma G.</span><button class="pill">Remove</button><button class="member-menu" aria-label="More for Alma G."><svg width="15" height="4" viewBox="0 0 15 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="7.5" cy="2" r="1.7"/><circle cx="13" cy="2" r="1.7"/></svg></button></div>
        <div class="row"><div class="av t3">T</div><span class="name">Theo R.</span><button class="pill">Remove</button><button class="member-menu" aria-label="More for Theo R."><svg width="15" height="4" viewBox="0 0 15 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="7.5" cy="2" r="1.7"/><circle cx="13" cy="2" r="1.7"/></svg></button></div>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
