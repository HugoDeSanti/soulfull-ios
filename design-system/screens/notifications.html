<!-- @dsCard group="Screens · Tabs" name="Community — notifications" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community — notifications</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  /* Features/Community/NotificationsView.swift. Pushed from the bell. One
     row per like on one of your finished practices — open rows on the dusk
     atmosphere, a hairline between them; unread rows carry a small ember dot
     for THIS visit, then everything is marked read
     (server-side `read_at` latches). Written only by the like trigger.
     When the liker is known, the row ends in "⋯" (.member-menu in app.css),
     after the unread dot: Report (with the liked practice attached) and
     Block, confirmed as on the community card. */
  .scr { padding: 62px var(--gutter) 130px; }
  .back { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink); }
  .eb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin: 36px 0 0; }
  h1 { font-size: 34px; font-weight: var(--w-light); letter-spacing: -0.8px; color: var(--ink); margin: 6px 0 0; }
  .sub { font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 6px 0 0; }
  .rows { display: flex; flex-direction: column; margin-top: 36px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 18px 0; }
  .row + .row { border-top: 0.5px solid var(--line); }
  .row .tx { flex: 1; min-width: 0; }
  .row p { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink-soft); }
  .row p b { font-weight: var(--w-medium); color: var(--ink); }
  .row .meta { display: block; margin-top: 5px; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ember); flex: none; }
  .row .member-menu { margin: 0 -10px 0 -8px; }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: var(--w-medium); color: var(--ink); border: var(--hairline) solid var(--glass-border); }
  .av.t2 { background-image: linear-gradient(135deg, #6b3d38, #40211f); }
  .av.t3 { background-image: linear-gradient(135deg, #334054, #1a2130); }
  /* EMPTY: open text under a hairline — "Nothing yet" (22 light) / "Finish a
     practice and it joins the Community feed, where people can like it.
     You'll hear about it here." */
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen screen--scroll scr">
    <div class="atmosphere atmosphere--dusk"></div>

    <a class="back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M20 12H4m0 0 6-6m-6 6 6 6"/></svg>Community</a>
    <div>
      <p class="eb">Likes</p>
      <h1>Notifications</h1>
      <p class="sub">When someone likes a practice you finished, it lands here.</p>
    </div>

    <div class="rows">
      <div class="row unread"><div class="av t2">A</div><div class="tx"><p><b>Alma G.</b> liked your <b>Morning Mobility</b> practice</p><span class="meta">42 min ago</span></div><span class="dot"></span><button class="member-menu" aria-label="More for Alma G."><svg width="15" height="4" viewBox="0 0 15 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="7.5" cy="2" r="1.7"/><circle cx="13" cy="2" r="1.7"/></svg></button></div>
      <div class="row"><div class="av t3">T</div><div class="tx"><p><b>Theo R.</b> liked your <b>Core &amp; Ground</b> practice</p><span class="meta">Saturday</span></div><button class="member-menu" aria-label="More for Theo R."><svg width="15" height="4" viewBox="0 0 15 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="7.5" cy="2" r="1.7"/><circle cx="13" cy="2" r="1.7"/></svg></button></div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
