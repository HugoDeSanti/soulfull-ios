<!-- @dsCard group="Screens · Retreats" name="Retreats — catalog (pinch)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retreats — catalog</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  .scr { padding-top: 50px; padding-bottom: 30px; }
  .hdr { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 20px 0; }
  .hdr .eb { font-size: 14px; font-weight: 500; letter-spacing: 4px; color: #fff; margin: 0; }
  .hdr p { font-size: 12px; line-height: 1.4; color: rgba(255,255,255,0.7); margin: 8px 0 0; max-width: 220px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 22px 20px 0; }
  .cover { position: relative; height: 224px; border-radius: 18px; overflow: hidden; border: 1px solid var(--glass-border); background-size: cover; background-position: center; box-shadow: 0 14px 28px -10px rgba(0,0,0,0.55); }
  .cover.active { border-color: rgba(229,199,102,0.7); }
  .cover .ov { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), transparent 40%, rgba(0,0,0,.66)); }
  .cover .folio { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85); }
  .cover .meta { position: absolute; left: 12px; bottom: 12px; right: 12px; }
  .cover .meta .m { font-size: 8.5px; letter-spacing: 1.8px; text-transform: uppercase; color: rgba(255,255,255,0.78); }
  .cover .meta .n { font-size: 21px; font-weight: 600; letter-spacing: -0.5px; color: #fff; margin-top: 3px; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen screen--scroll scr">
    <div class="photo" style="background:var(--bg)"></div>
    <div class="hdr">
      <div>
        <p class="eb">THE CATALOG</p>
        <p>Every gathering, side by side. Pinch in — or tap a cover — to return.</p>
      </div>
      <span class="circle-btn circle-btn--lg" style="position:relative;z-index:3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg></span>
    </div>
    <div class="grid">
      <div class="cover active" style="background-image:url('../assets/retreat-mallorca.jpg')"><div class="ov"></div><span class="folio">01</span><div class="meta"><div class="m">Spain · Sep</div><div class="n">Mallorca</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-kyoto.jpg')"><div class="ov"></div><span class="folio">02</span><div class="meta"><div class="m">Japan · Nov</div><div class="n">Kyoto</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-bali.jpg')"><div class="ov"></div><span class="folio">03</span><div class="meta"><div class="m">Indonesia · Jan</div><div class="n">Bali</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-sedona.jpg')"><div class="ov"></div><span class="folio">04</span><div class="meta"><div class="m">Arizona · Mar</div><div class="n">Sedona</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-dolomites.jpg')"><div class="ov"></div><span class="folio">05</span><div class="meta"><div class="m">Italy · Jun</div><div class="n">Dolomites</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-chamonix.jpg')"><div class="ov"></div><span class="folio">06</span><div class="meta"><div class="m">France · Feb</div><div class="n">Chamonix</div></div></div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
