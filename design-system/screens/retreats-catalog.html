<!-- @dsCard group="Screens · Retreats" name="Gatherings tab — catalog (pinch)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retreats — catalog</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<!--
  RetreatsStackView (catalog mode), inside the Gatherings tab. The .topbar is
  the SAME chrome as retreats-stack — just the mode toggle (a bare GlyphButton)
  as a tab root, which now shows the list glyph and sits exactly where the grid
  glyph was. The catalog has no header button of its own. Covers are square:
  country eyebrow, name (22 Regular), then the dates; the focused retreat is
  marked by an ink hairline, nothing more (no shadow, no glow). The backdrop
  photo blurs (16) and dims behind the sheet.
-->
<style>
  .scr { padding-top: 54px; padding-bottom: 116px; }
  .topbar { display: flex; justify-content: flex-end; align-items: center; min-height: 44px; padding: 4px calc(var(--gutter) - 12px) 0 var(--gutter); position: relative; z-index: 3; }
  .back { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 13px; color: var(--ink); }
  .intro { padding: 18px var(--gutter) 18px; position: relative; z-index: 2; }
  .intro .eb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
  .intro p { font-size: 14px; line-height: 1.5; color: var(--ink-on-photo); margin: 8px 0 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px var(--gutter) 0; position: relative; z-index: 2; }
  .cover { position: relative; height: 224px; overflow: hidden; border: var(--hairline) solid var(--glass-border); background-size: cover; background-position: center; }
  .cover.active { border-color: rgba(242,241,237,0.7); }
  .cover .ov { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), transparent 40%, rgba(0,0,0,.7)); }
  .cover .folio { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; color: rgba(242,241,237,0.85); }
  .cover .meta { position: absolute; left: 12px; bottom: 12px; right: 12px; }
  .cover .meta .m { font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--ink-soft); }
  .cover .meta .n { font-size: 22px; font-weight: 400; letter-spacing: -0.5px; color: var(--ink); margin-top: 3px; }
  .cover .meta .d { font-size: 11px; color: var(--ink-on-photo); margin-top: 3px; white-space: nowrap; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen screen--scroll scr">
    <div class="photo" style="background-image:url('../assets/retreat-mallorca.jpg');filter:saturate(.9) blur(16px) brightness(.68);transform:scale(1.08)"></div>
    <div class="vignette" style="background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.4),rgba(0,0,0,.6),rgba(0,0,0,.85))"></div>

    <div class="topbar">
      <span class="glyph-btn" aria-label="Stack view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 10h11M4 14h16M4 18h11"/></svg></span>
    </div>
    <div class="intro on-photo">
      <p class="eb">All gatherings</p>
      <p>Every retreat, side by side. Tap a cover to bring it into focus.</p>
    </div>
    <div class="grid">
      <div class="cover" style="background-image:url('../assets/retreat-lapland.jpg')"><div class="ov"></div><span class="folio">01</span><div class="meta on-photo"><div class="m">Finland</div><div class="n">Lapland</div><div class="d">January 10–15, 2027</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-chamonix.jpg')"><div class="ov"></div><span class="folio">02</span><div class="meta on-photo"><div class="m">France</div><div class="n">Chamonix</div><div class="d">February 2–7, 2027</div></div></div>
      <div class="cover active" style="background-image:url('../assets/retreat-mallorca.jpg')"><div class="ov"></div><span class="folio">03</span><div class="meta on-photo"><div class="m">Spain</div><div class="n">Mallorca</div><div class="d">July 21–26, 2027</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-dolomites.jpg')"><div class="ov"></div><span class="folio">04</span><div class="meta on-photo"><div class="m">Italy</div><div class="n">Dolomites</div><div class="d">September 8–13, 2027</div></div></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg><span class="nav-label">Home</span></button>
    <button class="nav-item is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span class="nav-label">Gatherings</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 20h20l-6.5-9-4 5.2L9 13zm12.5-8.5L19 5l3 6.5z"/></svg><span class="nav-label">Digital Retreats</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"/></svg><span class="nav-label">Practice</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="9" cy="8" r="3.4"/><circle cx="16.5" cy="9" r="2.8"/><path d="M3 19c0-3.2 2.7-5.2 6-5.2s6 2 6 5.2zM15 13.8c2.8 0 4.8 1.9 4.8 5.2H17"/></svg><span class="nav-label">Community</span></button>
    <button class="nav-item"><span class="nav-avatar">M</span><span class="nav-label">You</span></button>
  </nav>
  <div class="home-indicator"></div>
</div></div>
</body></html>
