<!-- @dsCard group="Screens · Retreats" name="Retreats — catalog (pinch)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retreats — catalog</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<!--
  RetreatsStackView (catalog mode). The .topbar is the SAME chrome as
  retreats-stack — "‹ Back" and the mode toggle, which now shows the list glyph
  and sits exactly where the grid glyph was. The catalog has no header button of
  its own. Covers: country eyebrow (10px — it was 8.5px), name, then the dates.
-->
<style>
  .scr { padding-top: 54px; padding-bottom: 30px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 4px 24px 0; position: relative; z-index: 3; }
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  .intro { padding: 18px 24px 18px; position: relative; z-index: 2; }
  .intro .eb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
  .intro p { font-size: 14px; line-height: 1.45; color: var(--ink-on-photo); margin: 8px 0 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 8px 20px 0; position: relative; z-index: 2; }
  .cover { position: relative; height: 224px; border-radius: 18px; overflow: hidden; border: 1px solid var(--glass-border); background-size: cover; background-position: center; box-shadow: 0 14px 28px -10px rgba(0,0,0,0.55); }
  .cover.active { border-color: rgba(229,199,102,0.7); }
  .cover .ov { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), transparent 40%, rgba(0,0,0,.7)); }
  .cover .folio { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.85); }
  .cover .meta { position: absolute; left: 12px; bottom: 12px; right: 12px; }
  .cover .meta .m { font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: rgba(255,255,255,0.82); }
  .cover .meta .n { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; color: #fff; margin-top: 3px; }
  .cover .meta .d { font-size: 11px; color: var(--ink-on-photo); margin-top: 3px; white-space: nowrap; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen screen--scroll scr">
    <div class="photo" style="background-image:url('../assets/retreat-mallorca.jpg');filter:blur(16px) brightness(.55)"></div>
    <div class="vignette" style="background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.4),rgba(0,0,0,.6),rgba(0,0,0,.85))"></div>

    <div class="topbar">
      <span class="back on-photo"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 18l-6-6 6-6"/></svg>Back</span>
      <span class="circle-btn circle-btn--lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h11M4 14h16M4 18h11"/></svg></span>
    </div>
    <div class="intro on-photo">
      <p class="eb">All gatherings</p>
      <p>Every retreat, side by side. Tap a cover to bring it into focus.</p>
    </div>
    <div class="grid">
      <div class="cover" style="background-image:url('../assets/retreat-lapland.jpg')"><div class="ov"></div><span class="folio">01</span><div class="meta on-photo"><div class="m">Finland</div><div class="n">Lapland</div><div class="d">January 10–15, 2027</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-chamonix.jpg')"><div class="ov"></div><span class="folio">02</span><div class="meta on-photo"><div class="m">France</div><div class="n">Chamonix</div><div class="d">February 2–7, 2027</div></div></div>
      <div class="cover active" style="background-image:url('../assets/retreat-mallorca.jpg')"><div class="ov"></div><span class="folio">03</span><div class="meta on-photo"><div class="m">Spain</div><div class="n">Mallorca</div><div class="d">July 21–26, 2027</div></div></div>
      <div class="cover" style="background-image:url('../assets/retreat-dolomites.jpg')"><div class="ov"></div><span class="folio">04</span><div class="meta on-photo"><div class="m">Italy</div><div class="n">Dolomites</div><div class="d">September 8–13, 2027</div></div></div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
