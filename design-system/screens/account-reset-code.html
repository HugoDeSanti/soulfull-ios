<!-- @dsCard group="Screens · Tabs" name="Account — new password" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account — new password</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  .close { position: absolute; top: 50px; right: calc(var(--gutter) - 13px); z-index: 20; }
  .scr { padding: 108px var(--gutter) 40px; text-align: center; }
  .mark { color: var(--ink); font-size: 34px; line-height: 1; }
  .scr h1 { font-size: 26px; font-weight: var(--w-light); letter-spacing: -0.4px; color: var(--ink); margin: 16px 0 0; }
  .scr p.lead { font-size: 14px; line-height: 1.55; color: var(--ink-on-photo); margin: 16px auto 0; max-width: 300px; }
  /* The same wide code field as account-confirm: one field for one-time-code autofill,
     digit count = mailer_otp_length. */
  .code { display: block; width: 100%; box-sizing: border-box; margin-top: 22px; padding: 18px 0;
          text-align: center; font-family: var(--font); font-size: 28px;
          font-weight: 300; letter-spacing: 10px; color: var(--ink); outline: none;
          background: rgba(255,255,255,.06); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
          border: var(--hairline) solid var(--glass-border); border-radius: var(--r-control); }
  .field { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 16px 18px; text-align: left; border-radius: var(--r-control); }
  .field.focus { border-color: rgba(242,241,237,.6); }
  .field svg { color: var(--ink-soft); flex: none; }
  .field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-family: var(--font); font-size: 16px; color: var(--ink); }
  .field-hint { margin: 10px 0 0 18px; font-size: 12px; color: var(--ink-on-photo); text-align: left; }
  .submit { margin-top: 16px; }
  .resend { display: block; margin-top: 14px; font-size: 13px; color: var(--ink-soft); }
  .alt { display: block; margin-top: 18px; font-size: 13px; color: var(--ink); text-decoration: underline; }
</style>
</head><body>
<!-- After "Send code". The code and the new password are one step. Swift: AccountView.newPasswordPanel.
     The copy never says whether the address has an account: GoTrue answers the same either way.
     Once the code is accepted (they're signed in from then on), the envelope becomes checkmark.seal,
     the heading reads "You're signed in" / "Now choose the password you'll use from here on.", and the
     code field, Send a new code and Back to sign in go — only the password is left to retry. -->
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <span class="close glyph-btn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></span>

  <div class="screen screen--scroll">
    <!-- Atmosphere(tone: .moss) — it used to be home-bg blurred into the sheet. -->
    <div class="photo" style="background-image:url('../assets/home-bg.jpg');filter:saturate(.9) brightness(.65) blur(8px);transform:scale(1.1)"></div>
    <div class="vignette" style="background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.74))"></div>
    <div class="top-scrim"></div>

    <div class="scr">
      <div class="mark">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="5" width="16" height="12" /><path d="M2 7l8 5.5L18 7"/><circle cx="19" cy="6" r="3.4" fill="currentColor" stroke="none"/></svg>
      </div>
      <h1 class="on-photo">Check your email</h1>
      <p class="lead on-photo">If there's an account for hugo@soulfullgatherings.com, we've sent it a code. Enter it with a new password. The code works wherever you read the email.</p>

      <input class="code" value="418025" />

      <div class="field glass focus">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5" y="11" width="14" height="9" /><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" value="········" />
      </div>
      <p class="field-hint on-photo">At least 8 characters</p>

      <div class="submit"><button class="sg-btn sg-btn--filled">Set new password</button></div>
      <!-- 60s cooldown after each send (smtp_max_frequency); reads "Send a new code" underlined in ink when ready. -->
      <span class="resend on-photo">Send a new code in 54s</span>
      <span class="alt">Back to sign in</span>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
