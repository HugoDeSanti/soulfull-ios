<!-- @dsCard group="Screens · Retreats" name="Retreats — name stack" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retreats — stack</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  .hdr { position: relative; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 24px 0; }
  .hdr .eb { font-size: 14px; font-weight: 500; letter-spacing: 4px; color: #fff; margin: 0; }
  .hdr p { font-size: 12px; line-height: 1.45; color: rgba(255,255,255,0.78); margin: 8px 0 0; max-width: 230px; }
  .hdr .ctrls { display: flex; gap: 10px; align-items: center; }
  .count { width: 42px; height: 42px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.4); display: grid; place-items: center; font-size: 12px; color: #fff; }

  .stack { position: relative; z-index: 5; padding: 36px 24px 0; }
  .item { padding: 12px 0; }
  .item .name { font-weight: 300; letter-spacing: -1.4px; color: #fff; line-height: 1; }
  .item .g { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7); margin-top: 6px; }
  .item.dim { opacity: .42; }
  .item.active .name { font-size: 54px; font-weight: 600; letter-spacing: -2px; }
  .item.active .g { color: var(--honey); }
  .item .name.s { font-size: 44px; }

  .botcard { position: absolute; left: 16px; right: 16px; bottom: 30px; z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: 22px; }
  .botcard .eb { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.75); margin: 0; }
  .botcard .tags { font-size: 15px; font-weight: 500; letter-spacing: -0.2px; color: #fff; margin-top: 6px; }
  .botcard .go { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #000; font-size: 13px; font-weight: 500; padding: 11px 16px; border-radius: 999px; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen safe-top">
    <div class="photo" style="background-image:url('../assets/retreat-mallorca.jpg');filter:saturate(1.1) brightness(.78)"></div>
    <div class="vignette" style="background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.15),rgba(0,0,0,.45),rgba(0,0,0,.78))"></div>

    <div class="hdr">
      <div>
        <p class="eb">SOULFULL</p>
        <p>Intimate, luxurious gatherings around the world — twelve seats, one table.</p>
      </div>
      <div class="ctrls">
        <span class="circle-btn circle-btn--lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
        <span class="circle-btn circle-btn--lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        <span class="count">07</span>
      </div>
    </div>

    <div class="stack">
      <div class="item dim"><div class="name s">Sedona</div><div class="g">10 guests</div></div>
      <div class="item active"><div class="name">Mallorca</div><div class="g">12 guests</div></div>
      <div class="item dim"><div class="name s">Kyoto</div><div class="g">10 guests</div></div>
      <div class="item dim"><div class="name s">Bali</div><div class="g">14 guests</div></div>
    </div>

    <div class="botcard glass glass-strong">
      <div>
        <p class="eb">Sep 2026 · Spain</p>
        <div class="tags">Coastal · Somatic · Slow living</div>
      </div>
      <span class="go">Open <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
