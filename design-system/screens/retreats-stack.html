<!-- @dsCard group="Screens · Retreats" name="Gatherings tab — name stack" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatherings — stack</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<!--
  RetreatsStackView (stack mode) — the root of the GATHERINGS TAB (2026-09-25).
  Home's "Upcoming gatherings" shelf and its ALL hand off here. Maps 1:1:
  - .hdr      → header: the tab's header, as every tab opens — "In person",
                "Gatherings", a 14px subline in --ink-on-photo — starting 10px
                under the status bar. The ONE mode toggle (grid ↔ list, a bare
                GlyphButton) sits at its top corner as on Practice; the folio
                ("03 / 04") under it on the title line follows the focused
                retreat. No Back as a tab root (it has "← Back" above the header
                only when pushed, e.g. the -preview-retreats hook). Shared by
                both modes; never scales or blurs.
  - .item     → row(): the NAME ONLY. The trailing guest count was removed — it
                read as a bare footnote number. Size lives on retreat-detail.
                In the app every name is 54px and a scroll-driven "focus lens"
                inks it (0.32 → 1) as it nears the centre line; only the weight
                (Thin → Regular) switches discretely. Nothing changes size — it
                used to scale 0.8 → 1.
  - .botcard  → bottomCard: glass at the card radius, one fact per line
                (country / dates / tags) + an ink "Explore →" block at the
                control radius. Its details crossfade as
                the stack moves; the panel holds still. The whole card is the tap
                target. It read
                "Reserve", which it never did — it opens the retreat. Sits 8pt
                above the docked tab bar (BottomNav.height).
-->
<style>
  /* The tab's header, as every tab opens: 10px under the status bar, eyebrow,
     title, subline (header, RetreatsStackView). The mode toggle sits at its
     top corner as on Practice; the folio under it on the title line, following
     the focused retreat in both modes. Shared chrome: it never scales or
     blurs, and only the subline changes between stack and catalog. */
  .hdr { position: relative; z-index: 6; padding: 10px var(--gutter) 0; }
  .hdr .glyph-btn { position: absolute; top: 10px; right: calc(var(--gutter) - 12px); }
  .hdr .eb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
  .hdr .title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 6px; }
  .hdr h1 { font-size: 38px; font-weight: var(--w-light); letter-spacing: -0.8px; color: var(--ink); margin: 0; }
  .hdr .folio { font-size: 12px; font-weight: 500; letter-spacing: 1px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: pre; }
  .hdr .folio b { font-weight: 500; color: var(--ink); }
  .hdr p { font-size: 14px; line-height: 1.55; color: var(--ink-on-photo); margin: 6px 0 0; }

  .stack { position: relative; z-index: 5; padding: 64px var(--gutter) 0;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 28%, #000 72%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 28%, #000 72%, transparent 100%); }
  .item { height: 84px; display: flex; align-items: center; }
  .item .name { font-size: 54px; font-weight: 100; letter-spacing: -1.6px; color: var(--ink); line-height: 1; white-space: nowrap; opacity: .32; }
  .item.active .name { font-weight: 400; opacity: 1; }

  .botcard { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 96px; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px; }
  .botcard .eb { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
  .botcard .when { font-size: 16px; font-weight: 500; letter-spacing: -0.2px; color: var(--ink); margin-top: 5px; }
  .botcard .tags { font-size: 13px; color: var(--ink-soft); margin-top: 5px; white-space: nowrap; }
  .botcard .go { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: #000; font-size: 13px; font-weight: 500; padding: 12px 18px; flex: none; border-radius: var(--r-control); }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen safe-top">
    <div class="photo" style="background-image:url('../assets/retreat-mallorca.jpg');filter:saturate(.9)"></div>
    <div class="vignette" style="background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.15),rgba(0,0,0,.45),rgba(0,0,0,.78))"></div>
    <div class="top-scrim"></div>

    <div class="hdr">
      <div class="on-photo">
        <p class="eb">In person</p>
        <div class="title"><h1>Gatherings</h1><span class="folio"><b>03</b>  /  04</span></div>
        <p>Small groups, in carefully chosen places.</p>
      </div>
      <span class="glyph-btn" aria-label="Show all retreats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></span>
    </div>
    <div class="stack on-photo">
      <div class="item"><div class="name">Lapland</div></div>
      <div class="item"><div class="name">Chamonix</div></div>
      <div class="item active"><div class="name">Mallorca</div></div>
      <div class="item"><div class="name">Dolomites</div></div>
    </div>

    <div class="botcard glass glass-strong">
      <div>
        <p class="eb">Spain</p>
        <div class="when">July 21–26, 2027</div>
        <div class="tags">Hyrox · Recovery · Wellness</div>
      </div>
      <span class="go">Explore <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16m0 0-6-6m6 6-6 6"/></svg></span>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg><span class="nav-label">Home</span></button>
    <button class="nav-item is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 19h20L14.5 7 7 19M2 19l5-7.6 2.4 3.7M5.7 13.4l.9.5.8-.5.9.4M12.3 10.6l1.1.7 1.1-.7 1.1.7 1.1-.7"/></svg><span class="nav-label">Gatherings</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 19.5h19M7.5 17a4.5 4.5 0 0 1 9 0M3.5 17h2M18.5 17h2M12 7.5V10M6.4 10l1.4 1.4M17.6 10l-1.4 1.4"/></svg><span class="nav-label">Digital Retreats</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.8" fill="currentColor" stroke="none"/><path d="M10.8 8.7h2.4l.5 6.4h-3.4z" fill="currentColor"/><path d="M10.8 9.3 7.4 13.3 5 11M13.2 9.3l3.4 4L19 11"/><path d="M4.8 17.6c3.4-2 11-2 14.4 0-3.4 1.5-11 1.5-14.4 0z" fill="currentColor"/></svg><span class="nav-label">Practice</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="9" cy="8" r="3.4"/><circle cx="16.5" cy="9" r="2.8"/><path d="M3 19c0-3.2 2.7-5.2 6-5.2s6 2 6 5.2zM15 13.8c2.8 0 4.8 1.9 4.8 5.2H17"/></svg><span class="nav-label">Community</span></button>
    <button class="nav-item"><span class="nav-avatar">M</span><span class="nav-label">You</span></button>
  </nav>
  <div class="home-indicator"></div>
</div></div>
</body></html>
