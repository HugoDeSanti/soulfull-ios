<!-- @dsCard group="Screens · Tabs" name="Community — report sent" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community — report sent</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  /* Features/Community/ReportMemberSheet.swift, after Send report succeeds
     (the same sheet as report-member, cross-faded). The review promise, then
     Block — so they needn't see this member while the team looks. Block here
     needs no second confirmation for a member: the consequences are spelled
     out beside the button. A guest is asked for an account first, then sees
     the Block confirmation (community card). Done closes the sheet. */
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 118px; z-index: 20; pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, transparent), color-mix(in srgb, var(--bg) 60%, transparent) 55%, transparent); }
  .close { position: absolute; top: 66px; right: 22px; z-index: 21; width: 38px; height: 38px; }
  .scr { padding: 118px 24px 48px; }
  .sent { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 360px; margin: 0 auto; }
  /* SF Symbol checkmark.seal, 34pt light, honey */
  .sent .mark { color: var(--honey); line-height: 0; margin-top: 70px; }
  .sent h1 { font-size: 30px; font-weight: var(--w-regular); letter-spacing: -0.3px; color: var(--ink); margin: 0; }
  .sent p.lead { font-size: 15px; line-height: 1.55; color: var(--ink-soft); margin: 0; }
  .sent .block { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .sent .cap { font-size: 12px; line-height: 1.45; color: var(--muted); margin: 0; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="bar"></div>
  <span class="close circle-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></span>

  <div class="screen screen--scroll scr">
    <div class="photo" style="background-image:url('../assets/welcome-bg.jpg');filter:saturate(1.1) brightness(.4) blur(28px);transform:scale(1.15)"></div>
    <div class="vignette vignette--deep"></div>

    <div class="sent">
      <div class="mark">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"><path d="M12 1.5l2.4 2 3.1-.3 1 3 2.7 1.6-1.2 2.9 1.2 2.9-2.7 1.6-1 3-3.1-.3-2.4 2-2.4-2-3.1.3-1-3L2.8 14.6 4 11.7 2.8 8.8l2.7-1.6 1-3 3.1.3 2.4-2z"/><path d="M8.3 12.1l2.5 2.5 4.9-5"/></svg>
      </div>
      <h1>Thank you</h1>
      <p class="lead">Our team reviews every report within 24 hours and removes anything that breaks our community standards.</p>
      <div class="block">
        <button class="sg-btn">Block Theo R.</button>
        <p class="cap">You won't see each other in Community, and they won't be told.</p>
      </div>
      <button class="sg-btn sg-btn--filled">Done</button>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
