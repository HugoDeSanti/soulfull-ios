<!-- @dsCard group="Screens · Tabs" name="You — blocked members" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You — blocked members</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  /* Features/Community/BlockedMembersView.swift. A sheet from the You tab's
     Community section ("Blocked members" row, profile.html): who you've
     blocked, and Unblock beside each (no confirmation; the row leaves).
     Backdrop: welcome-bg, blur 28 / darken .86, no top scrim; close button in
     a pinned bar with a bg gradient (92% → 60% → clear), as report-member.
     EMPTY: one glass card (18 padding, body 14 --ink-soft) — "You haven't
     blocked anyone. You can block a member from the ⋯ beside their name in
     Community."
     FAILED LOAD: glass card, headline 20 "You're offline" / "Couldn't load
     this list", body 14 "Reconnect to see who you've blocked." / "Something
     went wrong at our end. Please try again in a moment.", outline "Try
     again". A failed Unblock shows a honey-tinted banner (6% / 30%) under the
     header. */
  .scr { padding: 118px 20px 60px; }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 118px; z-index: 20; pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, transparent), color-mix(in srgb, var(--bg) 60%, transparent) 55%, transparent); }
  .close { position: absolute; top: 66px; right: 22px; z-index: 21; width: 38px; height: 38px; }
  .body { position: relative; z-index: 3; }
  .eb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
  h1 { font-size: 30px; font-weight: var(--w-regular); letter-spacing: -0.3px; color: var(--ink); margin: 8px 0 0; }
  .sub { font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 8px 0 0; }
  .rows { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  /* Same anatomy as the Friends screen's MemberRow: face, name, one pill. */
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 18px; }
  .row .name { flex: 1; min-width: 0; font-size: 15px; font-weight: var(--w-medium); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: var(--w-medium); color: var(--ink); border: 1px solid var(--glass-border-high); }
  .av.t0 { background-image: linear-gradient(135deg, #4f5c29, #333d17); }
  .av.t4 { background-image: linear-gradient(135deg, #806b4f, #544530); }
  /* Unblock — quiet glass capsule, 34pt, stroke glassBorderHigh; 50% while it works. */
  .pill { height: 34px; padding: 0 14px; border-radius: 999px; font-family: var(--font); font-size: 13px; font-weight: var(--w-medium); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; border-color: var(--glass-border-high); }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="bar"></div>
  <span class="close circle-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></span>

  <div class="screen screen--scroll scr">
    <div class="photo" style="background-image:url('../assets/welcome-bg.jpg');filter:saturate(1.1) brightness(.4) blur(28px);transform:scale(1.15)"></div>
    <div class="vignette vignette--deep"></div>

    <div class="body">
      <p class="eb">Community</p>
      <h1>Blocked members</h1>
      <p class="sub">You and the people you block don't see each other anywhere in Community. Unblocking doesn't bring back a friendship or likes the block ended.</p>

      <div class="rows">
        <div class="row glass"><div class="av t4">R</div><span class="name">Rafa M.</span><button class="pill glass">Unblock</button></div>
        <div class="row glass"><div class="av t0">J</div><span class="name">Jules B.</span><button class="pill glass">Unblock</button></div>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
