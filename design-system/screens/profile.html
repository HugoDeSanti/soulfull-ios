<!-- @dsCard group="Screens · Tabs" name="You — profile" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You — profile</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  .wrap { position: relative; z-index: 5; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 90px 28px 120px; }
  .wrap img { width: 88px; }
  .eb { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink); margin: 18px 0 0; }
  h1 { font-size: 36px; font-weight: var(--w-regular); letter-spacing: -0.3px; color: var(--ink); margin: 8px 0 0; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); margin: 16px 0 0; }
  .status svg { color: var(--honey); }
  .intentions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 18px 0 0; }
  .legal { display:flex; align-items:center; justify-content:center; margin-top:4px; }
  .legal a { font-size:12px; color:var(--ink-soft); padding:8px 0; text-decoration:none; }
  .legal .sep { font-size:12px; color:var(--muted); padding:0 10px; }
  .actions { width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .delete { background: none; border: 0; font-family: var(--font); font-size: 13px; color: #d95c54; cursor: pointer; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen">
    <div class="photo" style="background-image:url('../assets/home-bg.jpg');filter:saturate(1.1) brightness(.7) blur(4px);transform:scale(1.06)"></div>
    <div class="vignette vignette--deep"></div>
    <div class="aurora" style="opacity:.35;mix-blend-mode:plus-lighter"></div>

    <div class="wrap">
      <img class="breathing" src="../assets/logo.png" alt="">
      <p class="eb">Hugo</p>
      <h1>Welcome back.</h1>
      <div class="status">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 1.7 2.9-.2 1 2.8 2.4 1.7-.9 2.8.9 2.8-2.4 1.7-1 2.8-2.9-.2L12 22l-2.4-1.7-2.9.2-1-2.8L3.3 16l.9-2.8L3.3 10.4l2.4-1.7 1-2.8 2.9.2z"/><path d="M9 12l2 2 4-4" stroke="#15170d" stroke-width="2" fill="none"/></svg>
        hugo@soulfullgatherings.com
      </div>
      <div class="intentions">
        <span class="chip">Rest &amp; repair</span>
        <span class="chip">Connection</span>
        <span class="chip">Adventure</span>
      </div>

      <div class="actions">
        <button class="sg-btn sg-btn--filled">Sign out</button>
        <button class="delete">Delete account</button>
        <!-- App Store Connect requires a resolving privacy policy URL and a
             support URL; an app that creates accounts needs both reachable
             in-app. Destinations live in Core/Services/LegalLinks.swift. -->
        <div class="legal">
          <a href="#">Privacy</a><span class="sep">&middot;</span><a href="#">Terms</a><span class="sep">&middot;</span><a href="#">Support</a>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V10z"/></svg></button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17z"/></svg></button>
    <button class="nav-item is-active"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="3.2"/><path d="M6.5 18.5c1-2.4 3-3.5 5.5-3.5s4.5 1.1 5.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="nav-label">You</span></button>
  </nav>
  <div class="home-indicator"></div>
</div></div>
</body></html>
