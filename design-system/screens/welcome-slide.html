<!-- @dsCard group="Screens · Welcome" name="Welcome — explainer slide" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — slide</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  /* WelcomeView.slideStack — the masthead up top, the copy low on the page
     above hairline segments, with the photograph and space between. */
  .screen { display: flex; flex-direction: column; }
  .topbar { position: relative; z-index: 5; display: flex; align-items: flex-start; justify-content: space-between; padding: 24px var(--gutter) 0; }
  .topbar img { width: 56px; opacity: .88; }
  .folio { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: var(--w-medium); letter-spacing: 1.5px; color: var(--ink); padding-top: 6px; }
  .folio span { opacity: .5; }
  .copy { position: relative; z-index: 5; padding: 0 var(--gutter); margin-top: auto; }
  .copy .eb { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 20px; }
  .copy h2 { font-size: 30px; font-weight: var(--w-light); letter-spacing: -0.6px; line-height: 1.16; margin: 0 0 20px; color: var(--ink); }
  .copy h2 .dim { color: rgba(242,241,237,0.62); }
  .copy p { font-size: 14px; line-height: 1.55; color: var(--ink-on-photo); margin: 0; }
  .bottom { position: relative; padding: 36px var(--gutter) 32px; z-index: 5; }
  .segs { display: flex; gap: 6px; margin-bottom: 28px; }
  .segs span { height: 1px; flex: 1; background: rgba(242,241,237,0.22); border-radius: var(--r-mark); }
  .segs span.on { background: rgba(242,241,237,0.92); }
  .actions { display: flex; flex-direction: column; gap: 4px; align-items: center; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>
  <div class="screen safe-top">
    <div class="photo" style="background-image:url('../assets/welcome-bg.jpg');filter:saturate(.9) brightness(.95) blur(6px);transform:scale(1.16) translateX(-3%)"></div>
    <div class="vignette" style="background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.30),rgba(0,0,0,.62))"></div>
    <div class="top-scrim"></div>

    <div class="topbar"><img src="../assets/logo.png" alt=""><span class="folio">02 <span>/ 02</span></span></div>

    <div class="copy on-photo">
      <div class="eb">A Conscious Community</div>
      <h2>A worldwide community <span class="dim">that travels, heals, and connects.</span></h2>
      <!-- Slide 1 ("Digital & Physical Retreats" · "Wellness retreats, online
           and around the world.") reads: "Luxurious in-person gatherings and
           self-paced digital retreats — breathwork, meditation, somatic
           exercises, movement, and nourishing food." Its button reads Next and
           has no sign-in link. Pages hand over with a focus pull (blur + fade),
           nothing slides; the photograph pans slowly between them. -->
      <p>A conscious space for shared practice — see what the circle is practicing, and practice alongside friends.</p>
    </div>

    <div class="bottom">
      <div class="segs"><span class="on"></span><span class="on"></span></div>
      <div class="actions">
        <button class="sg-btn">Begin</button>
        <button class="quiet-btn" style="padding:14px 12px">I already have an account</button>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
