<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — slide</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  .topbar { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 8px 24px 0; }
  .topbar img { width: 56px; opacity: .88; }
  .folio { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: var(--w-medium); letter-spacing: 1.5px; color: rgba(255,255,255,.8); }
  .copy { position: relative; z-index: 5; padding: 40px 26px 0; }
  .copy .eb { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,.7); margin-bottom: 16px; }
  .copy h2 { font-size: 26px; font-weight: var(--w-medium); letter-spacing: -0.4px; line-height: 1.16; margin: 0 0 18px; color: var(--ink); }
  .copy h2 .dim { color: rgba(255,255,255,0.62); }
  .copy p { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.66); margin: 0; max-width: 300px; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 38px; padding: 0 26px; z-index: 5; }
  .segs { display: flex; gap: 6px; margin-bottom: 26px; }
  .segs span { height: 2px; flex: 1; border-radius: 2px; background: rgba(255,255,255,0.22); }
  .segs span.on { background: rgba(255,255,255,0.92); }
  .actions { display: flex; flex-direction: column; gap: 4px; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>
  <div class="screen safe-top">
    <div class="photo" style="background-image:url('../assets/welcome-bg.jpg');filter:saturate(1.15) brightness(.85) blur(4px);transform:scale(1.12) translateX(-3%)"></div>
    <div class="vignette" style="background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.45),rgba(0,0,0,.7))"></div>

    <div class="topbar"><img src="../assets/logo.png" alt=""><span class="folio">02 / 03</span></div>

      <div class="eb">The Soulfull Way</div>

      <p>A conscious space for honest conversation, shared rituals, and the kind of friendships that outlast the retreat.</p>
    </div>

    <div class="bottom">
      <div class="segs"><span></span><span class="on"></span><span></span></div>
      <div class="actions">
        <button class="sg-btn sg-btn--filled">Next</button>
        <button class="quiet-btn" style="padding:12px">I already have an account</button>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
