<!-- @dsCard group="Screens · Tabs" name="You — your name" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You — your name</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  /* Features/Profile/EditNameSheet.swift. A sheet from the name on the You
     tab (members only; never asked for, only offered). The name lives on the
     profile, in two parts: Home greets by the first name, Community shows it
     with the last initial, and a guide linked to the account is named by both
     everywhere.
     Ground: welcome-bg (as the Report sheet; home-bg's sky was too bright under
     the eyebrow), blur 28, darken .86, no top scrim, still visible. The
     fields are UIKit-backed, so nothing blurs or shades over them (rendering
     gotcha 1): the close button sits in a pinned bar with a bg GRADIENT
     (92% → 60% → clear), never a blur, and .on-photo goes on the copy only. */
  .scr { padding: 122px var(--gutter) 48px; }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 118px; z-index: 20; pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, transparent), color-mix(in srgb, var(--bg) 60%, transparent) 55%, transparent); }
  .close { position: absolute; top: 62px; right: calc(var(--gutter) - 14px); z-index: 21; }
  .form { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 32px; }
  .head .eb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
  .head h1 { font-size: 30px; font-weight: var(--w-light); letter-spacing: -0.6px; color: var(--ink); margin: 10px 0 0; }
  /* The shortened form is spelled out as it is typed ("Mara L."), the one
     place a member sees what everyone else will. A linked guide's line adds
     "Your guide pages use it too." */
  .head p { font-size: 14px; line-height: 1.55; color: var(--ink-on-photo); margin: 10px 0 0; }
  /* The account sheet's two rows, 14 apart: "First name" with the person
     glyph, "Last name" with its slot kept empty so both start on one line.
     Square glass, hairline turning ink on the focused one; each part capped
     at 64 as it is typed, and 64 together as stored (MemberName). */
  .fields { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; align-items: center; gap: 12px; padding: 17px 18px; }
  .field.focus { border-color: rgba(242,241,237,.6); }
  .field svg { color: var(--muted); flex: none; }
  .field .slot { width: 18px; flex: none; }
  /* Date of birth under the name (optional here; the only place an Apple
     member can give one): the account sheet's row and wheel. Can be changed,
     not removed. The eyebrow reads "Your details", and the explanation ends
     "Your date of birth stays private." */
  .field .value { flex: 1; font-size: 16px; color: var(--muted); }
  .field input { flex: 1; background: transparent; border: 0; outline: none; font-family: var(--font); font-size: 16px; color: var(--ink); }
  /* Save (filled) is disabled at 40% while either part is blank or the name
     is unchanged (a one-word name from before the parts is completed here),
     and reads "Saving…" while it writes, with the close dimmed and
     swipe-to-dismiss off. FAILURE: one line above the button, 13 --ink, and
     the name stays: offline → "You're offline, so your name hasn't changed.
     Reconnect and try again." / our end → "Something went wrong at our end,
     and your name hasn't changed. Please try again." */
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="bar"></div>
  <span class="close glyph-btn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></span>

  <div class="screen screen--scroll scr">
    <div class="photo" style="background-image:url('../assets/welcome-bg.jpg');filter:saturate(.9) brightness(.4) blur(28px);transform:scale(1.15)"></div>
    <div class="vignette vignette--deep"></div>

    <div class="form">
      <div class="head on-photo">
        <p class="eb">Your details</p>
        <h1>What should we call you?</h1>
        <p>Other members see “Mara L.” in Community, and Home greets you by your first name. Your date of birth stays private.</p>
      </div>

      <div class="fields">
        <div class="field glass focus">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input value="Mara" placeholder="First name" />
        </div>
        <div class="field glass">
          <span class="slot"></span>
          <input value="Lopez" placeholder="Last name" />
        </div>
        <div class="field glass">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.5" y="5" width="17" height="15"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="value">Date of birth</span>
        </div>
      </div>

      <button class="sg-btn sg-btn--filled">Save</button>
    </div>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
