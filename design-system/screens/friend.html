<!-- @dsCard group="Screens · Tabs" name="Community — a friend" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community — a friend</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  /* Features/Community/FriendView.swift. Pushed from a friend's row on the
     Friends screen (friends.html). Their face (64pt) with "⋯" (Report, Block)
     across from it, then eyebrow / 34pt name / subline, open on the page's
     photo (welcome-bg, blur 24, darken .8). Then their practice in the four
     figures of the You tab's table (profile.html, `StatTile`), worked out by
     the same rules from friend_practice_stats() (0034): numbers only, never
     which practices or which days. The streak's caption says when they last
     practiced: "Practiced today" / "Last practiced yesterday" / "Last
     practiced Friday" / "Last practiced 12 Sep". Best: "They're on it now"
     when the best IS the current run, else "Days in a row". Dashes until the
     numbers are in.
     PRIVATE (Share my practice off): the subline reads "They keep their
     practice to themselves." and the table is replaced by "Nothing to show
     while Alma G. keeps “Share my practice” off."
     FAILED: the glass retry line ("You're offline. Reconnect to see their
     practice." / "We couldn't load their practice just now." · ember Try
     again) in place of the table.
     At the foot, a quiet centred "Remove friend" (ink-soft), which asks
     first; the page closes once they're no longer a friend. */
  .scr { padding: 62px var(--gutter) 130px; }
  .back { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink); }
  .head { margin-top: 28px; }
  .face { display: flex; align-items: center; justify-content: space-between; }
  .av { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: var(--w-medium); color: var(--ink); border: var(--hairline) solid var(--glass-border); background-image: linear-gradient(135deg, #6b3d38, #40211f); }
  .eb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin: 20px 0 0; }
  h1 { font-size: 34px; font-weight: var(--w-light); letter-spacing: -0.7px; color: var(--ink); margin: 6px 0 0; }
  .sub { font-size: 14px; line-height: 1.55; color: var(--ink-on-photo); margin: 6px 0 0; }
  .sec { margin-top: var(--header-gap, 40px); }
  .sec .section-label { --sl-pad: 0; margin-bottom: 24px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .stats .rule { grid-column: 1 / -1; height: 0.5px; background: var(--line); margin: 24px 0; }
  .stat .n { font-size: 44px; font-weight: var(--w-light); letter-spacing: -1px; color: var(--ink); line-height: 1; }
  .stat .lbl { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--ink-soft); margin-top: 10px; }
  .stat .lbl svg { color: var(--ink-soft); flex: none; }
  .stat.accent .lbl svg { color: var(--ember); }
  .stat .cap { font-size: 12px; line-height: 1.4; color: var(--ink-soft); margin-top: 8px; min-height: 2.8em; }
  .remove { display: block; width: 100%; margin-top: 64px; padding: 12px 0; background: none; border: 0; font-family: var(--font); font-size: 13px; color: var(--ink-soft); text-align: center; }
</style>
</head><body>
<div class="stage"><div class="device">
  <div class="island"></div>
  <div class="statusbar"><span class="clock">9:41</span><span class="glyphs">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="4.7" width="3" height="6.3" rx="1"/><rect x="9.4" y="2.3" width="3" height="8.7" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <span class="batt"><i></i></span></span></div>

  <div class="screen screen--scroll scr">
    <div class="photo" style="background-image:url('../assets/welcome-bg.jpg');filter:saturate(.9) brightness(.55) blur(24px);transform:scale(1.1)"></div>
    <div class="vignette vignette--deep"></div>
    <div class="top-scrim"></div>

    <a class="back on-photo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M20 12H4m0 0 6-6m-6 6 6 6"/></svg>Friends</a>

    <div class="head">
      <div class="face">
        <div class="av">A</div>
        <button class="member-menu" aria-label="More for Alma G."><svg width="15" height="4" viewBox="0 0 15 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="7.5" cy="2" r="1.7"/><circle cx="13" cy="2" r="1.7"/></svg></button>
      </div>
      <div class="on-photo">
        <p class="eb">Friend</p>
        <h1>Alma G.</h1>
        <p class="sub">Their practice, in the numbers they see on their own You tab.</p>
      </div>
    </div>

    <div class="sec">
      <div class="section-label on-photo"><span class="title">Their practice</span></div>
      <div class="stats on-photo">
        <div class="stat accent">
          <span class="n">12</span>
          <span class="lbl"><svg width="9" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-3 5.5-3 9.5A3.5 3.5 0 0 0 12 15c2 0 3.5-1.6 3.5-3.6 0-1-.4-2-1-2.8 2.6 1.4 4.5 4.2 4.5 7.4A7 7 0 0 1 12 23a7 7 0 0 1-7-7c0-6 7-8 7-14z"/></svg>Day streak</span>
          <span class="cap">Practiced today</span>
        </div>
        <div class="stat">
          <span class="n">21</span>
          <span class="lbl"><svg width="9" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c-5-2-8-6-8-11M6 14c-2 0-3-1-3.5-2.5M5 10C3.5 9.5 3 8 3 6.5M8 17.5c-1.5.5-3 0-4-1"/></svg>Best streak</span>
          <span class="cap">Days in a row</span>
        </div>
        <div class="rule"></div>
        <div class="stat">
          <span class="n">48</span>
          <span class="lbl"><svg width="10" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.4"/><path d="M4 12.5c2.6.2 4.9-.6 6.5-2h3c1.6 1.4 3.9 2.2 6.5 2v1.8c-2.4.1-4.4-.4-6-1.5V15l4 3.5-1.2 1.4L12 17l-4.8 2.9L6 18.5l4-3.5v-2.2c-1.6 1.1-3.6 1.6-6 1.5z"/></svg>Classes taken</span>
          <span class="cap">Sessions &amp; movement</span>
        </div>
        <div class="stat">
          <span class="n">612</span>
          <span class="lbl"><svg width="8" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12M6 22h12M7 2c0 6 10 6 10 10S7 16 7 22M17 2c0 6-10 6-10 10s10 4 10 10"/></svg>Minutes practiced</span>
          <span class="cap">10 hr, 12 min</span>
        </div>
      </div>
    </div>

    <button class="remove on-photo">Remove friend</button>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body></html>
