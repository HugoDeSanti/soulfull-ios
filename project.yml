name: SoulfullGatherings
options:
  bundleIdPrefix: com.soulfullgatherings
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Supplied by Config/Secrets.xcconfig (gitignored) so the Team ID stays out
    # of the repo. Empty is fine for simulator builds; archiving for the App
    # Store requires a real ID.
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "2"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  Stripe:
    # Slim, SPM-optimized distribution (no multi-GB git history / test fixtures
    # that make the main stripe/stripe-ios repo extremely slow to resolve).
    url: https://github.com/stripe/stripe-ios-spm
    minVersion: 23.0.0
    maxVersion: 100.0.0

targets:
  SoulfullGatherings:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: SoulfullGatherings
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: SoulfullGatherings/Info.plist
      properties:
        CFBundleDisplayName: Soulfull
        CFBundleIdentifier: com.soulfullgatherings.app
        CFBundleVersion: "2"
        CFBundleShortVersionString: "0.0.1"
        # Required by App Store upload validation (ITMS-90683), NOT by our code.
        # StripePaymentSheet links a card scanner (STPCardScanner /
        # CardScanningView), so the camera API reference is present in the
        # binary even though AppFeatures.paymentsEnabled = false makes it
        # unreachable. Apple's static scan does not do reachability analysis.
        # Removing this key fails every upload; it can only go away by dropping
        # the Stripe dependency entirely.
        NSCameraUsageDescription: >-
          Used only if you choose to scan a payment card when reserving a
          retreat, so you don't have to type the number by hand.
        # Modern launch screen (no storyboard file). The colour is the
        # LaunchBackground asset — Theme.bg — so the cold-launch frame is the
        # same near-black RootView fades its breathing logo up from.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # HTTPS and platform crypto only — the exempt case. Without this key
        # every upload stalls waiting on a manual answer in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.soulfullgatherings.app
            CFBundleURLSchemes:
              - soulfull
        UIAppFonts:
          - Geist-Thin.otf
          - Geist-Light.otf
          - Geist-Regular.otf
          - Geist-Medium.otf
          - Geist-SemiBold.otf
          - Geist-Bold.otf
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Stripe
        product: StripePaymentSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulfullgatherings.app
        INFOPLIST_FILE: SoulfullGatherings/Info.plist
        # iPhone only. Without this Xcode defaults to "1,2", which claims iPad
        # support — App Store Connect then demands iPad screenshots and the
        # reviewer tests this portrait-only, iPhone-tuned UI on an iPad.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
