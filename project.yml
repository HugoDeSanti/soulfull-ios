name: SoulfullGatherings
options:
  bundleIdPrefix: com.soulfullgatherings
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Supplied by Config/Secrets.xcconfig (gitignored) so the Team ID stays out
    # of the repo. Empty is fine for simulator builds; archiving for the App
    # Store requires a real ID.
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    # Keep these in step with info.properties.CFBundleShortVersionString /
    # CFBundleVersion below. They are SEPARATE keys — xcodegen writes the
    # info.properties pair into Info.plist verbatim and these into build
    # settings — and they drifted once already: R6 bumped the plist pair to
    # 1.0 (3) and left these reading 0.0.1 (2).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "16"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

schemes:
  SoulfullGatherings:
    build:
      targets:
        SoulfullGatherings: all
        SoulfullTests: [test]
        SoulfullUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SoulfullTests
        - SoulfullUITests

targets:
  # Unit tests (Swift Testing), hosted in the app so they can `@testable import`
  # it. The host renders nothing and runs no launch work while they run — see
  # `SoulfullGatheringsApp.isHostingUnitTests`. Testing policy: CLAUDE.md → Testing.
  SoulfullTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SoulfullTests
    dependencies:
      - target: SoulfullGatherings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulfullgatherings.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  SoulfullUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SoulfullUITests
    dependencies:
      - target: SoulfullGatherings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulfullgatherings.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  SoulfullGatherings:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: SoulfullGatherings
      - path: Resources/Fonts
        buildPhase: resources
    # Sign in with Apple. Generated by XcodeGen (like Info.plist) and wired to
    # CODE_SIGN_ENTITLEMENTS automatically — edit it here, not the .entitlements
    # file. The App ID also needs the capability enabled in the developer portal;
    # automatic signing adds it on the first archive.
    entitlements:
      path: SoulfullGatherings/SoulfullGatherings.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Push notifications (likes on your practices — see PushRegistrar and
        # supabase/functions/send-like-push). `development` here is what a
        # Debug build on a device registers with; an App Store / TestFlight
        # export rewrites it to `production` from the distribution profile.
        # The App ID needs the Push Notifications capability enabled.
        aps-environment: development
    info:
      path: SoulfullGatherings/Info.plist
      properties:
        CFBundleDisplayName: Soulfull
        CFBundleIdentifier: com.soulfullgatherings.app
        CFBundleVersion: "16"
        # Must match the version record created in App Store Connect. A build whose
        # CFBundleShortVersionString is 0.0.1 will not attach to a "1.0" version.
        CFBundleShortVersionString: "1.0"
        # NO NSCameraUsageDescription, deliberately. It existed only because
        # StripePaymentSheet linked a card scanner (STPCardScanner /
        # CardScanningView), which put a camera API reference in the binary and
        # tripped ITMS-90683 — while AppFeatures.paymentsEnabled = false made it
        # unreachable. Declaring a purpose string for a capability the app can't
        # reach invites a reviewer to ask where the camera is used, and the
        # honest answer was "nowhere". Stripe is gone from v1, so the key goes
        # with it. If payments come back, the dependency brings this key back too.
        # Modern launch screen (no storyboard file). The colour is the
        # LaunchBackground asset — Theme.bg — so the cold-launch frame is the
        # same near-black RootView fades its breathing logo up from.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # HTTPS and platform crypto only — the exempt case. Without this key
        # every upload stalls waiting on a manual answer in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.soulfullgatherings.app
            CFBundleURLSchemes:
              - soulfull
        UIAppFonts:
          - Geist-Thin.otf
          - Geist-Light.otf
          - Geist-Regular.otf
          - Geist-Medium.otf
          - Geist-SemiBold.otf
          - Geist-Bold.otf
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # Audio sessions keep playing with the screen locked or the app in the
        # background, the way any guided meditation is listened to. Without it
        # iOS suspends the app, and the session, the moment the phone locks.
        # Only the player's `.playback` audio session uses it; video still
        # pauses in the background, which AVFoundation does by itself.
        UIBackgroundModes:
          - audio
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulfullgatherings.app
        INFOPLIST_FILE: SoulfullGatherings/Info.plist
        # iPhone only. Without this Xcode defaults to "1,2", which claims iPad
        # support — App Store Connect then demands iPad screenshots and the
        # reviewer tests this portrait-only, iPhone-tuned UI on an iPad.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
