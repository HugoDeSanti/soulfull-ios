name: SoulfullGatherings
options:
  bundleIdPrefix: com.soulfullgatherings
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  Stripe:
    # Slim, SPM-optimized distribution (no multi-GB git history / test fixtures
    # that make the main stripe/stripe-ios repo extremely slow to resolve).
    url: https://github.com/stripe/stripe-ios-spm
    minVersion: 23.0.0
    maxVersion: 100.0.0

targets:
  SoulfullGatherings:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: SoulfullGatherings
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: SoulfullGatherings/Info.plist
      properties:
        CFBundleDisplayName: Soulfull Gatherings
        CFBundleIdentifier: com.soulfullgatherings.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIAppFonts:
          - Geist-Thin.otf
          - Geist-Light.otf
          - Geist-Regular.otf
          - Geist-Medium.otf
          - Geist-SemiBold.otf
          - Geist-Bold.otf
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Stripe
        product: StripePaymentSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulfullgatherings.app
        INFOPLIST_FILE: SoulfullGatherings/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
